[project]
name = "pharmacy-platform-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "uuid6>=2024.7.10,<2026",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "aiosqlite>=0.20,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  # pytest-asyncio still calls the loop-policy APIs deprecated in Python 3.14.
  "ignore:'asyncio.[gs]et_event_loop_policy' is deprecated:DeprecationWarning",
]
