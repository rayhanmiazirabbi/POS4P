[package]
name = "app-desktop"
version = "0.1.0"
description = "Pharmacy Platform desktop shell"
edition = "2021"

[lib]
name = "app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Local key-value store: a real SQLite database file, compiled into the binary so
# the packaged till needs no system SQLite.
rusqlite = { version = "0.37", features = ["bundled"] }
# Legacy `store.json` migration and nothing else; the store itself is SQLite now.
serde_json = "1"
